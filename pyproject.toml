[project]
name = "digit-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhi", email = "hello@abhirath.net" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "gradio==6.30.0",
    "numpy>=2.1,<3",
    "opencv-python-headless>=4.11,<5",
    "pillow>=11,<13",
    "huggingface-hub>=1,<2",
    "safetensors>=0.5,<1",
    "torch==2.7.0",
]

[project.optional-dependencies]
training = ["torchvision==0.22.0"]
animation = ["manim==0.21.0", "imageio-ffmpeg>=0.6,<0.7"]
dev = ["pytest>=8"]
browser = ["playwright>=1.64,<2"]

[project.scripts]
digit-classifier = "digit_classifier:main"
training = "training:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"
